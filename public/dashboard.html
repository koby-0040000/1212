<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIONYX - דשבורד מחשבים</title>
<style>
  :root {
    --bg:#eef1f7; --card:#ffffff; --text:#1b2333; --muted:#6a7488; --line:#e1e6ef;
    --ok:#16a34a; --off:#9aa3b2; --busy:#d97706; --bad:#dc2626; --accent:#2563eb; --accent2:#7c3aed;
    --shadow:0 1px 2px rgba(20,30,60,.06), 0 6px 18px rgba(20,30,60,.06);
    --shadow-hover:0 2px 4px rgba(20,30,60,.08), 0 14px 32px rgba(37,99,235,.16);
    --track:#e8ecf4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#1a1f29; --text:#e9ecf3; --muted:#98a2b5; --line:#2a313e; --accent:#5b8def; --accent2:#9b7bff;
            --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 14px 32px rgba(91,141,239,.22); --track:#2a313e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",Arial,sans-serif; }
  .hidden { display:none !important; }
  a { text-decoration:none; }

  /* ---------- header ---------- */
  header { position:sticky; top:0; z-index:5; color:#fff; padding:16px 22px;
           background:linear-gradient(120deg,var(--accent) 0%,var(--accent2) 100%); box-shadow:0 4px 18px rgba(37,99,235,.28);
           display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:42px; height:42px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:22px; backdrop-filter:blur(4px); }
  h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  .live { font-size:12px; opacity:.85; display:flex; align-items:center; gap:6px; margin-top:2px; }
  .live i { width:8px; height:8px; border-radius:50%; background:#4ade80; animation:pulse 1.6s infinite; }
  .chips { display:flex; gap:10px; flex-wrap:wrap; }
  .chip { background:rgba(255,255,255,.16); border-radius:12px; padding:6px 14px; text-align:center; min-width:74px; backdrop-filter:blur(4px); }
  .chip b { display:block; font-size:20px; line-height:1.15; }
  .chip span { font-size:11px; opacity:.85; }
  .tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header input[type=text] { padding:9px 12px; border:0; border-radius:10px; background:rgba(255,255,255,.18); color:#fff; font-size:14px; min-width:170px; outline:none; }
  header input::placeholder { color:rgba(255,255,255,.75); }
  header input:focus { background:rgba(255,255,255,.28); }
  header button { background:rgba(255,255,255,.16); border:0; color:#fff; }
  header button:hover { background:rgba(255,255,255,.28); }
  header button.primary { background:#fff; color:var(--accent); font-weight:600; }
  header button.primary:hover { background:#f1f5ff; }

  button { padding:8px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); cursor:pointer; font-size:14px; transition:transform .12s, background .15s, box-shadow .15s; }
  button:active:not(:disabled) { transform:scale(.96); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { filter:brightness(1.1); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=password] { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font-size:14px; }

  /* ---------- grid + cards ---------- */
  main { padding:22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px;
          box-shadow:var(--shadow); overflow:hidden; transition:transform .18s, box-shadow .18s, opacity .3s, filter .3s; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--off); transition:background .3s; }
  .card.s-online::before { background:linear-gradient(90deg,#22c55e,#16a34a); }
  .card.s-busy::before, .card.s-removing::before { background:linear-gradient(90deg,#f59e0b,#d97706); }
  .card.s-failed::before { background:linear-gradient(90deg,#ef4444,#dc2626); }
  .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
  .card.s-off { opacity:.72; filter:saturate(.55); }
  .card.enter { animation:rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .num { font-size:20px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .num .pc { font-size:20px; }
  .badge { font-size:12px; padding:4px 10px; border-radius:999px; color:#fff; background:var(--off); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .badge.online { background:var(--ok); } .badge.busy, .badge.removing { background:var(--busy); } .badge.failed { background:var(--bad); }
  .badge .dot { width:7px; height:7px; border-radius:50%; background:#fff; }
  .badge.online .dot { animation:pulse 1.6s infinite; }
  .badge.removing .dot { width:10px; height:10px; background:none; border:2px solid #fff; border-top-color:transparent; animation:spin .8s linear infinite; }
  .sub { color:var(--muted); font-size:13px; min-height:18px; }
  .note { font-size:12px; padding:7px 10px; border-radius:10px; background:rgba(220,38,38,.1); color:var(--bad); }
  .gauges { display:flex; flex-direction:column; gap:8px; }
  .g-head { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .g-head b { color:var(--text); font-weight:600; }
  .track { height:8px; border-radius:99px; background:var(--track); overflow:hidden; }
  .fill { height:100%; width:0; border-radius:99px; background:var(--ok); transition:width .8s cubic-bezier(.2,.8,.2,1), background .4s; }
  .fill.warn { background:var(--busy); } .fill.bad { background:var(--bad); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; padding:3px 9px; border-radius:8px; background:var(--track); color:var(--text); }
  .tag.ok { background:rgba(22,163,74,.14); color:var(--ok); } .tag.warn { background:rgba(217,119,6,.15); color:var(--busy); }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .row .primary { flex:1; }
  .row .half { flex:1 1 calc(50% - 6px); font-weight:600; order:5; }
  .row .wide { flex:1 1 100%; order:5; font-weight:600; }
  .small { padding:6px 9px; font-size:12px; }
  select.small { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); max-width:120px; cursor:pointer; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:70px 10px; line-height:1.9; }
  .empty .big { font-size:46px; display:block; margin-bottom:6px; animation:float 3s ease-in-out infinite; }

  /* ---------- login ---------- */
  #login { max-width:340px; margin:11vh auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); text-align:center; animation:rise .5s both; }
  #login .logo { margin:0 auto; background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; width:56px; height:56px; font-size:28px; }
  #login h1 { font-size:20px; }
  #login .err { color:var(--bad); font-size:13px; min-height:16px; }

  /* ---------- toast ---------- */
  #toasts { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:20; align-items:center; pointer-events:none; }
  .toast { background:#1f2937; color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:90vw; animation:rise .3s both; pointer-events:auto; }
  .toast.err { background:var(--bad); } .toast.ok { background:var(--ok); }
  .toast.out { opacity:0; transform:translateY(8px); transition:.3s; }

  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)} 70%{box-shadow:0 0 0 7px rgba(74,222,128,0)} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0)} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* ---------- sysinfo modal ---------- */
  #sysModal { position:fixed; inset:0; background:rgba(10,14,25,.5); z-index:30; display:flex; align-items:center; justify-content:center; padding:16px; }
  .sysBox { background:var(--card); color:var(--text); border-radius:16px; max-width:560px; width:100%; max-height:80vh; overflow:auto; box-shadow:var(--shadow-hover); animation:rise .3s both; }
  .sysHead { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); }
  .sysHead b { font-size:16px; }
  #sysBody { padding:16px 18px; font-size:14px; }
  .sysLoading { text-align:center; color:var(--muted); padding:30px 10px; }
  .sysCpuLine { font-size:15px; font-weight:600; margin-bottom:4px; }
  .sysSub2 { color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  table.sysTbl { width:100%; border-collapse:collapse; font-size:13px; }
  table.sysTbl th { text-align:right; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  table.sysTbl td { padding:5px 6px; border-bottom:1px solid var(--line); }
  table.sysTbl td.pctCell { font-weight:600; }
  .pctHigh { color:var(--bad); } .pctMed { color:var(--busy); }
  .sysGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin:0 0 12px; font-size:13px; }
  .sysGrid div span { color:var(--muted); }
  .sysInsight { background:rgba(217,119,6,.12); border-radius:10px; padding:9px 11px; margin-bottom:12px; font-size:13px; line-height:1.5; }
  .sysInsight.ok { background:rgba(22,163,74,.12); }
  .procHint { display:block; color:var(--muted); font-size:11.5px; }
  button.kill { padding:3px 9px; font-size:12px; color:var(--bad); border-color:var(--bad); background:transparent; }
  button.kill:disabled { opacity:.5; }
  .waitBox { text-align:center; padding:18px 8px 8px; }
  .waitSpin { width:46px; height:46px; margin:0 auto 12px; border-radius:50%; border:4px solid var(--track); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  .waitStep { font-weight:600; font-size:15px; margin-bottom:10px; }
  .waitBar { height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin:0 10px 6px; }
  .waitBar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .9s linear; }
  .waitSec { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .waitFact { background:var(--track); border-radius:12px; padding:11px 13px; font-size:13.5px; line-height:1.55; min-height:44px; transition:opacity .3s; }
  .netBox { border-top:1px solid var(--track); margin-top:14px; padding-top:12px; }
  .netHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; }
  .netRows { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:13px; margin-bottom:8px; }
  .netRows span { color:var(--muted); }
  .netGood { color:var(--ok); font-weight:700; } .netMid { color:var(--busy); font-weight:700; } .netBad { color:var(--bad); font-weight:700; }
  .card.s-unstable { opacity:.9; }
  .badge.unstable { background:var(--busy); }
  .sel { width:17px; height:17px; cursor:pointer; accent-color:var(--accent); margin:0; }
  .num .numTxt { cursor:pointer; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 22px 0; }
  #bar .f { padding:5px 12px; font-size:13px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  #bar .f.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #bulk { display:none; gap:8px; align-items:center; margin-inline-start:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px 10px; font-size:13px; }
  #bulk select { border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); padding:4px; }
  .evRow { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.45; }
  .evRow time { color:var(--muted); white-space:nowrap; min-width:92px; font-size:12px; }
  .logPre { direction:ltr; text-align:left; background:#0f172a; color:#cbd5e1; padding:10px; border-radius:10px; font-size:11.5px; line-height:1.5; white-space:pre-wrap; word-break:break-all; max-height:55vh; overflow:auto; margin:0; }
  .hLeg { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:4px; }
  .hLeg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px; }
  .lockMark { color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="logo">&#128421;</div>
  <h1>כניסה לדשבורד</h1>
  <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password">
  <button class="primary" id="loginBtn">כניסה</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <div class="logo">&#128421;</div>
      <div>
        <h1>מחשבים מרוחקים</h1>
        <div class="live"><i></i> מתעדכן אוטומטית</div>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><b id="sOnline">0</b><span>פעילים</span></div>
      <div class="chip"><b id="sUnst">0</b><span>מתחברים מחדש</span></div>
      <div class="chip"><b id="sOff">0</b><span>לא מחוברים</span></div>
      <div class="chip"><b id="sTotal">0</b><span>סה״כ</span></div>
    </div>
    <div class="tools">
      <input id="q" type="text" placeholder="&#128269; חיפוש מספר / שם">
      <button id="evBtn" type="button" title="אירועים, התראות והגדרות">&#128276; אירועים</button>
      <a href="/api/installer" download><button class="primary" type="button">&#11015; הורד מתקין</button></a>
      <button id="logout">יציאה</button>
    </div>
  </header>
  <div id="bar">
    <button class="f on" data-f="all">הכל</button>
    <button class="f" data-f="off">לא מחוברים</button>
    <button class="f" data-f="hot">עומס גבוה</button>
    <button class="f" data-f="stale">לא מעודכנים</button>
    <button class="f" id="selAll" title="סמן את כל המחשבים המחוברים (לפי הסינון)">&#9745; בחר מחוברים</button>
    <div id="bulk">
      <b id="bulkN"></b>
      <select id="bulkAct"><option value="">פעולה לנבחרים...</option><option value="lock">נעילה</option><option value="logoff">התנתקות משתמש</option><option value="restart">אתחול</option><option value="shutdown">כיבוי</option><option value="restartfilter">הפעל מחדש שירותי סינון</option><option value="diagnose">🩺 סרוק בעיות</option></select>
      <button class="small primary" id="bulkGo" type="button">בצע</button>
      <button class="small" id="bulkClear" type="button">נקה</button>
    </div>
  </div>
  <main id="grid"></main>
</div>
<div id="toasts"></div>

<div id="sysModal" class="hidden">
  <div class="sysBox">
    <div class="sysHead">
      <b id="sysTitle">פרטי מחשב</b>
      <button id="sysClose" class="small" type="button">&#10005;</button>
    </div>
    <div id="sysBody"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let data = [], timer = null;
const cards = new Map();      // computer number -> { el, refs }
let emptyEl = null;
let filterMode = 'all';
const selected = new Set();

function toast(msg, kind) {
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, kind === 'err' ? 6500 : 4000);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: 'same-origin',
  });
  let json = {}; try { json = await res.json(); } catch {}
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw Object.assign(new Error(json.error || res.statusText), { status: res.status });
  return json;
}

function showLogin() { clearInterval(timer); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pw').focus(); }
function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); refresh(); clearInterval(timer); timer = setInterval(refresh, 5000); }

function ago(ms) {
  if (!ms) return 'אף פעם';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `לפני ${s} שנ׳`;
  if (s < 3600) return `לפני ${Math.round(s / 60)} דק׳`;
  if (s < 86400) return `לפני ${Math.round(s / 3600)} שע׳`;
  return `לפני ${Math.round(s / 86400)} ימים`;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function makeGauge(label) {
  const wrap = el('div'), head = el('div', 'g-head'), l = el('span', null, label), v = el('b');
  head.append(l, v);
  const track = el('div', 'track'), fill = el('div', 'fill'); track.appendChild(fill);
  wrap.append(head, track);
  return { wrap, set(pct, text) {
    v.textContent = text;
    fill.style.width = Math.max(2, Math.min(100, pct)) + '%';
    fill.className = 'fill' + (pct >= 90 ? ' bad' : pct >= 70 ? ' warn' : '');
  } };
}

function makeCard(c) {
  const card = el('div', 'card enter');
  const top = el('div', 'top');
  const num = el('span', 'num'); const sel = el('input', 'sel'); sel.type = 'checkbox'; sel.title = 'בחירה לפעולה מרובה'; const pc = el('span', 'pc', '\u{1F5A5}\uFE0F'); const numTxt = el('span', 'numTxt', 'מחשב ' + c.number); numTxt.title = 'לחץ לשינוי שם'; num.append(sel, pc, numTxt);
  const badge = el('span', 'badge'); const dot = el('i', 'dot'); const badgeTxt = el('span'); badge.append(dot, badgeTxt);
  top.append(num, badge);
  const sub = el('div', 'sub'), seen = el('div', 'sub'), note = el('div', 'note');
  const gauges = el('div', 'gauges');
  const gCpu = makeGauge('מעבד'), gRam = makeGauge('זיכרון'), gDisk = makeGauge('דיסק C:');
  gauges.append(gCpu.wrap, gRam.wrap, gDisk.wrap);
  const tags = el('div', 'tags');
  const row = el('div', 'row');
  const go = el('button', 'primary', 'התחבר');
  const cmd = el('select', 'small'); cmd.title = 'עוד פעולות';
  for (const [v, t] of [['', '\u22EF עוד...'], ['rename', 'שינוי שם'], ['getlog', 'יומן סוכן'], ['cad', 'Ctrl+Alt+Del'], ['lock', 'נעילה'], ['logoff', 'התנתקות משתמש'], ['restart', 'אתחול'], ['shutdown', 'כיבוי'], ['restartfilter', 'הפעל מחדש שירותי סינון'], ['forget', 'הסר מהרשימה'], ['uninstall', 'הסר תוכנה מהמחשב']]) {
    const o = el('option', null, t); o.value = v; cmd.appendChild(o);
  }
  const sys = el('button', 'small half', '\u{1F4CA} פרטי מחשב'); sys.title = 'דגם המעבד, מה מעמיס עליו כרגע, ואפשרות לסיים תהליכים';
  const rep_ = el('button', 'small half', '\u{1FA7A} בדוק ותקן'); rep_.title = 'סורק את המחשב לבעיות נפוצות (איטיות, דיסק מלא, שירותים כבויים, שעון...) ומציע תיקונים';
  row.append(go, cmd, sys, rep_);
  card.append(top, sub, seen, note, gauges, tags, row);
  card.addEventListener('animationend', () => card.classList.remove('enter'), { once: true });
  const entry = { el: card, c, refs: { numTxt, sel, badge, badgeTxt, sub, seen, note, gauges, gCpu, gRam, gDisk, tags, go, cmd, sys, rep: rep_ } };
  go.onclick = () => connect(entry.c, go);
  numTxt.onclick = () => rename(entry.c);
  sel.onchange = () => { if (sel.checked) selected.add(entry.c.number); else selected.delete(entry.c.number); updateBulk(); };
  cmd.onchange = () => {
    const v = cmd.value; cmd.value = ''; cmd.blur();

function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = data
    .filter((c) => filterMode === 'all' || (filterMode === 'off' && !c.online) || (filterMode === 'hot' && c.online && c.stats && c.stats.cpuPct >= 80) || (filterMode === 'stale' && !c.upToDate))
    .filter((c) => !q || c.number.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || c.hostname.toLowerCase().includes(q))
    .sort((a, b) => a.number.localeCompare(b.number, undefined, { numeric: true }));
  const grid = $('grid');
  if (!list.length) {
    for (const [, e] of cards) e.el.remove(); cards.clear();
    if (!emptyEl) {
      emptyEl = el('div', 'empty');
      emptyEl.append(el('span', 'big', '\u{1F5A5}\uFE0F'));
    }
    emptyEl.lastChild.nodeType === 3 && emptyEl.lastChild.remove();
    emptyEl.append(document.createTextNode(data.length ? 'לא נמצאו תוצאות' : 'עדיין אין מחשבים רשומים. לחץ "הורד מתקין", הרץ אותו על המחשב (לחיצה כפולה), והוא יופיע כאן.'));
    if (!emptyEl.parentNode) grid.appendChild(emptyEl);
    return;
  }
  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
  const keep = new Set(list.map((c) => c.number));
  for (const [n, e] of cards) if (!keep.has(n)) { e.el.remove(); cards.delete(n); }
  list.forEach((c, i) => {
    let e = cards.get(c.number);
    if (!e) { e = makeCard(c); cards.set(c.number, e); }
    paint(e, c);
    if (grid.children[i] !== e.el) grid.insertBefore(e.el, grid.children[i] || null);
  });
}

let sysLoad = null; // { t0, timer, factTimer }
function stopSysLoad() { if (sysLoad) { clearInterval(sysLoad.timer); clearInterval(sysLoad.factTimer); sysLoad = null; } }
const SYS_WAIT_MS = 45000;

function startSysLoad() {
  stopSysLoad();
  const body = $('sysBody');
  body.innerHTML = `<div class="waitBox"><div class="waitSpin"></div><div class="waitStep" id="wStep"></div>
    <div class="waitBar"><i id="wBar"></i></div><div class="waitSec" id="wSec"></div>
    <div class="waitFact" id="wFact"></div></div>`;
  const t0 = Date.now();
  let fi = Math.floor(Math.random() * WAIT_FACTS.length);
  $('wFact').textContent = WAIT_FACTS[fi];
  const tick = () => {
    const el_ = Date.now() - t0, sec = Math.floor(el_ / 1000);
    const step = $('wStep'); if (!step) return stopSysLoad();
    step.textContent = WAIT_STEPS[Math.min(WAIT_STEPS.length - 1, Math.floor(sec / 6))];
    $('wBar').style.width = Math.min(95, el_ / SYS_WAIT_MS * 100) + '%';
    $('wSec').textContent = 'עברו ' + sec + ' שניות';
  };
  tick();
  sysLoad = {
    t0, timer: setInterval(tick, 1000),
    factTimer: setInterval(() => {
      const f = $('wFact'); if (!f) return;
      fi = (fi + 1) % WAIT_FACTS.length; f.style.opacity = 0;
      setTimeout(() => { f.textContent = WAIT_FACTS[fi]; f.style.opacity = 1; }, 300);
    }, 5000),
  };
}

const CMD_LABEL = { cad: 'Ctrl+Alt+Del', lock: 'נעילה', logoff: 'התנתקות משתמש', restart: 'אתחול', shutdown: 'כיבוי', uninstall: 'הסרת התוכנה מהמחשב', restartfilter: 'הפעלה מחדש של שירותי הסינון' };
async function sendCommand(c, action) {
  if (!action) return;
  if (action === 'uninstall') {
    if (!confirm(`להסיר את התוכנה ממחשב ${c.number}?\n\nהסוכן יימחק מהמחשב עצמו (המשימה המתוזמנת והתיקייה C:\\ProgramData\\SionyxAgent), והמחשב יימחק מהרשימה.\nאחרי זה לא תהיה אפשרות שליטה מרחוק עד שתתקין מחדש.`)) return;
  } else if (['logoff', 'restart', 'shutdown', 'restartfilter'].includes(action) && !confirm(`לבצע "${CMD_LABEL[action]}" במחשב ${c.number}?`)) return;
  try {
    await api(`/computers/${encodeURIComponent(c.number)}/command`, { method: 'POST', body: { action } });
    toast(action === 'uninstall'
      ? `פקודת ההסרה נשלחה למחשב ${c.number}. תוך כמה שניות התוכנה תימחק והוא ייעלם מהרשימה.`
      : `"${CMD_LABEL[action]}" נשלח למחשב ${c.number} (יתבצע תוך כמה שניות)`, 'ok');
    refresh();
  } catch (e) {
    if (e.status === 409 && /agent_outdated/.test(e.message || '')) toast(action === 'uninstall' ? `במחשב ${c.number} רץ סוכן ישן שלא מכיר את פקודת ההסרה. יש להריץ עליו את המתקין מחדש פעם אחת, ואז אפשר להסיר מרחוק.` : OUTDATED_MSG, 'err');
    else toast(e.status === 409 ? 'המחשב כבוי או לא מגיב' : 'שגיאה: ' + e.message, 'err');
  }
}

// ---------- 24h history chart (inside "פרטי מחשב") ----------
async function loadHistory(c) {
  const box = $('histBox'); if (!box) return;
  try { const r = await api(`/computers/${encodeURIComponent(c.number)}/history`); drawHist(box, r.samples || [], r.step || 120000); }
  catch (e) { box.innerHTML = ''; }
}
function drawHist(box, samples, step) {
  const head = '<div class="netHead"><span>\u{1F4C8} 24 השעות האחרונות</span></div>';
  if (samples.length < 2) { box.innerHTML = head + '<div class="sysSub2">עדיין אין מספיק נתונים (נדגם כל 2 דקות, ההיסטוריה מצטברת מעכשיו).</div>'; return; }
  const W = 520, H = 140, L = 26, R = 6, T = 8, B = 20;
  const t1 = Date.now(), t0 = t1 - 24 * 3600e3;
  const x = (t) => L + Math.max(0, (t - t0) / (t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - Math.min(100, Math.max(0, v)) / 100) * (H - T - B);
  const path = (i) => { let d = '', prev = null; for (const s of samples) { const v = s[i]; if (v == null) { prev = null; continue; } d += (prev == null || s[0] - prev > step * 3 ? 'M' : 'L') + x(s[0]).toFixed(1) + ',' + y(v).toFixed(1) + ' '; prev = s[0]; } return d; };
  const cpus = samples.map((s) => s[1]).filter((v) => v != null);
  const max = cpus.length ? Math.max(...cpus) : 0, avg = cpus.length ? Math.round(cpus.reduce((a, b) => a + b, 0) / cpus.length) : 0;
  const grid = [0, 50, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="${L - 4}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".6">${v}</text>`).join('');
  const hours = [0, 6, 12, 18, 24].map((h) => { const t = t0 + h * 3600e3; return `<text x="${x(t)}" y="${H - 5}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${h === 24 ? 'עכשיו' : new Date(t).getHours() + ':00'}</text>`; }).join('');
  box.innerHTML = head + `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr;color:var(--text)">${grid}${hours}
    <path d="${path(2)}" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="${path(1)}" fill="none" stroke="#2f6fed" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <div class="hLeg"><span><i style="background:#2f6fed"></i>מעבד (ממוצע ${avg}%, שיא ${max}%)</span><span><i style="background:#d97706"></i>זיכרון</span><span>רווח בקו = המחשב לא היה מחובר</span></div>`;
}

  dns_slow: { t: (p) => p.ms < 0 ? 'ה-DNS לא מצליח לפענח את שם השרת' : `ה-DNS איטי (${p.ms} ms)`, d: 'פענוח שמות איטי גורם לאתרים להיטען לאט. התיקון מנקה את מטמון ה-DNS.' },
  adapter_disabled: { t: () => 'כרטיס הרשת מושבת', d: 'כרטיס הרשת כבוי ולכן אין חיבור. התיקון מפעיל אותו.' },
  adapter_down: { t: () => 'אין כרטיס רשת פעיל', d: 'כבל הרשת כנראה מנותק, או ש-Wi-Fi כבוי או מחוץ לטווח. אי אפשר לתקן את זה מרחוק, צריך לבדוק פיזית את הכבל או הנתב.' },
  apipa: { t: (p) => `אין כתובת IP תקינה (${p.ip || 'ללא'})`, d: 'המחשב לא קיבל כתובת מהנתב (DHCP). התיקון מבקש כתובת חדשה.' },
  no_gateway: { t: () => 'לא מוגדר נתב (Gateway)', d: 'בלי נתב אין יציאה מהרשת המקומית. התיקון מבקש הגדרות חדשות מהנתב.' },
  gw_unreachable: { t: (p) => `הנתב (${p.gw}) לא עונה`, d: 'המחשב מחובר לרשת אבל הנתב לא מגיב. התיקון מאתחל את כרטיס הרשת. אם זה לא עוזר, הבעיה בנתב, במתג או בכבל.' },
  proxy_set: { t: () => 'מוגדר פרוקסי של המערכת', d: (p) => `${p.line || ''} - פרוקסי שגוי יכול לשבור את החיבור. לא משנים אותו אוטומטית, כי סינון עשוי להצריך אותו.` },
  hosts_override: { t: (p) => `קובץ hosts מנתב את ${p.host} למקום אחר`, d: 'מישהו או משהו שינה את קובץ ה-hosts, וזה מונע מהמחשב להגיע לשרת. צריך למחוק את השורה ידנית (C:\\Windows\\System32\\drivers\\etc\\hosts).' },
  power_saver: { t: () => 'תוכנית החשמל היא "חיסכון באנרגיה"', d: 'התוכנית הזו מאטה את המעבד בכוונה. התיקון עובר לתוכנית "מאוזן".' },
  pending_reboot: { t: () => 'Windows מחכה לאתחול', d: 'עדכון או התקנה לא הושלמו עד שיתבצע אתחול, וזה גורם לאיטיות. מומלץ לאתחל.', act: 'restart' },
  long_uptime: { t: (p) => `המחשב דלוק ${p.days} ימים בלי אתחול`, d: 'אתחול מנקה תהליכים תקועים ומשלים עדכונים.', act: 'restart' },
  ram_high: { t: (p) => `הזיכרון כמעט מלא (${p.usedPct}%)`, d: (p) => `התהליך הגדול ביותר: ${p.name} (${p.mb} MB). סגירת התוכנה או אתחול יעזרו.`, act: 'restart' },
  cpu_hog: { t: (p) => `${p.name} מעמיס על המעבד (${p.pct}%)`, d: 'אם התוכנה לא נחוצה אפשר לסיים אותה מכאן. תהליכי מערכת מוגנים ולא יסתיימו.', act: 'kill' },
};
const FIX_INFO = {
  clean_temp: { l: 'נקה קבצים זמניים', c: 'למחוק קבצים זמניים ישנים (מעל יום) מתיקיות Temp של Windows והמשתמשים?' },
  start_services: { l: 'הפעל שירותים', c: 'להפעיל את השירותים שנעצרו (סינון, VNC ושירותי מערכת חשובים)?' },
  sync_time: { l: 'סנכרן שעון', c: 'לסנכרן את שעון המחשב?' },
  flush_dns: { l: 'נקה DNS', c: 'לנקות את מטמון ה-DNS?' },
  repair_wmi: { l: 'תקן WMI', c: 'לבדוק ולתקן את מאגר ה-WMI ולסנכרן מוני ביצועים? זה לא מאתחל את המחשב.' },
  renew_ip: { l: 'בקש כתובת IP חדשה', c: 'לשחרר ולחדש את כתובת ה-IP (DHCP)? החיבור יתנתק לכמה שניות.' },
  restart_adapter: { l: 'אתחל כרטיס רשת', c: 'לאתחל את כרטיס הרשת? החיבור יתנתק לכמה שניות ואם אתה בשליטה מרחוק היא תיפול.' },
  enable_adapter: { l: 'הפעל כרטיס רשת', c: 'להפעיל את כרטיס הרשת המושבת?' },
  reset_network_stack: { l: 'איפוס מלא של הרשת', c: 'לאפס את מחסנית הרשת של Windows (winsock ו-TCP/IP)? זה פותר בעיות רשת עקשניות, ויש אחר כך לאתחל את המחשב כדי שיכנס לתוקף.' },
  power_balanced: { l: 'תוכנית "מאוזן"', c: 'להחליף את תוכנית החשמל ל"מאוזן"?' },
};
let repairWatch = null, fixWatch = null;
const REPAIR_WAIT_MS = 90000;

function openRepair(c) {
  stopSysLoad(); sysWatch = null; logWatch = null;
  $('sysModal').classList.remove('hidden');
  $('sysTitle').textContent = '\u{1FA7A} בדיקה ותיקון - מחשב ' + c.number;
  startScan(c);
}
function startScan(c) {
  startSysLoad();
  repairWatch = { number: c.number, requestedAt: Date.now() };
  api(`/computers/${encodeURIComponent(c.number)}/command`, { method: 'POST', body: { action: 'diagnose' } })
    .catch((e) => { stopSysLoad(); repairWatch = null; $('sysBody').innerHTML = `<div class="sysLoading">${e.message === 'agent_outdated' ? OUTDATED_MSG : e.status === 409 ? 'המחשב לא מחובר' : 'שגיאה: ' + esc(e.message)}</div>`; });
}
function checkRepairWatch() {
  if (!repairWatch) return;
  const c = data.find((x) => x.number === repairWatch.number); if (!c) { repairWatch = null; return; }
  const fresh = c.diagAt && c.diagAt >= repairWatch.requestedAt;
  if (!fresh && Date.now() - repairWatch.requestedAt < REPAIR_WAIT_MS) return;
  repairWatch = null; stopSysLoad();
  if ($('sysModal').classList.contains('hidden')) return;
  if (!fresh) { $('sysBody').innerHTML = '<div class="sysLoading">המחשב לא החזיר תוצאות בזמן (הסריקה לוקחת עד כדקה). ייתכן שהוא עמוס מאוד. אפשר לנסות שוב.</div>'; return; }
  showDiag(c);
}
async function showDiag(c) {
  try {
    const r = await api(`/computers/${encodeURIComponent(c.number)}/diag`);
    if ($('sysModal').classList.contains('hidden')) return;
    renderRepair(c, r.diag);
  } catch (e) { $('sysBody').innerHTML = '<div class="sysLoading">שגיאה בטעינת התוצאות</div>'; }
}
function renderRepair(c, diag) {
  const body = $('sysBody');
  if (!diag) { body.innerHTML = '<div class="sysLoading">אין תוצאות.</div>'; return; }
  const list = diag.findings.slice().sort((a, b) => (a.sev === 'bad' ? 0 : 1) - (b.sev === 'bad' ? 0 : 1));
  const fixIds = [...new Set(list.map((f) => f.fix).filter(Boolean))];
  let html = '';
  if (!list.length) {
    html += `<div class="sysInsight ok">\u2705 לא נמצאו בעיות (נבדקו ${diag.checks} בדיקות תוך ${diag.took} שניות).</div>`;
  } else {
    html += `<div class="sysInsight">נבדקו ${diag.checks} בדיקות ונמצאו <b>${list.length}</b> ממצאים.${fixIds.length ? ' <button id="fixAll" class="small primary" type="button">\u{1F527} תקן הכל (' + fixIds.length + ')</button>' : ''}</div>`;
    html += list.map((f) => {
      const m = DIAG[f.id] || { t: () => f.id, d: '' };
      const desc = typeof m.d === 'function' ? m.d(f.p) : m.d;
      let btns = '';
      if (f.fix) btns += `<button class="small primary" data-fix="${esc(f.fix)}" type="button">${esc((FIX_INFO[f.fix] || {}).l || 'תקן')}</button> `;
      if (m.act === 'restart') btns += '<button class="small" data-act="restart" type="button">אתחל עכשיו</button>';
      if (m.act === 'kill' && f.p.pid) btns += `<button class="small kill" data-act="kill" data-pid="${f.p.pid}" data-name="${esc(f.p.name)}" type="button">סיים תהליך</button>`;
      return `<div class="evRow" style="align-items:flex-start"><span>${SEV_ICON[f.sev] || ''}</span><div style="flex:1"><b>${esc(m.t(f.p))}</b><div class="sysSub2" style="margin:2px 0 6px">${esc(desc)}</div>${btns}</div></div>`;
    }).join('');
  }
  html += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button id="rescan" class="small" type="button">\u{1F504} סרוק שוב</button><button class="small" data-fix="reset_network_stack" type="button" title="פותר בעיות רשת עקשניות. דורש אתחול אחרי">\u{1F6E0} איפוס מלא של הרשת</button></div>';
  body.innerHTML = html;
  body.querySelectorAll('button[data-fix]').forEach((b) => { b.onclick = () => applyFixes(c, [b.dataset.fix]); });
  const fa = $('fixAll'); if (fa) fa.onclick = () => applyFixes(c, fixIds);
  body.querySelectorAll('button[data-act]').forEach((b) => {
    b.onclick = async () => {
      if (b.dataset.act === 'restart') { await sendCommand(c, 'restart'); return; }
      const name = b.dataset.name;
      if (!confirm(`לסיים את התהליך "${name}" במחשב ${c.number}?\nעבודה לא שמורה בתוכנה הזו תאבד.`)) return;
      try { await api(`/computers/${encodeURIComponent(c.number)}/kill`, { method: 'POST', body: { pid: Number(b.dataset.pid), name } }); toast('הבקשה נשלחה. סרוק שוב בעוד רגע כדי לוודא.', 'ok'); }
      catch (e) { toast(e.message === 'agent_outdated' ? OUTDATED_MSG : 'שגיאה: ' + e.message, 'err'); }
    };
  });
  $('rescan').onclick = () => startScan(c);
}
async function applyFixes(c, ids) {
  const text = ids.map((id) => '\u2022 ' + ((FIX_INFO[id] || {}).c || id)).join('\n');
  if (!confirm(`לבצע במחשב ${c.number}:\n\n${text}`)) return;
  try { await api(`/computers/${encodeURIComponent(c.number)}/fix`, { method: 'POST', body: { ids } }); }
  catch (e) { toast(e.message === 'agent_outdated' ? OUTDATED_MSG : e.status === 409 ? 'המחשב לא מחובר' : 'שגיאה: ' + e.message, 'err'); return; }
  fixWatch = { number: c.number, requestedAt: Date.now(), ids: ids.slice() };
  $('sysBody').innerHTML = '<div class="waitBox"><div class="waitSpin"></div><div class="waitStep">מתקן...</div><div class="waitSec">התיקונים רצים אחד אחרי השני במחשב (עד כמה דקות). אפשר להשאיר את החלון פתוח.</div></div>';
}
async function checkFixWatch() {
  if (!fixWatch) return;
  const w = fixWatch;
  const c = data.find((x) => x.number === w.number); if (!c) { fixWatch = null; return; }
  const timedOut = Date.now() - w.requestedAt > 5 * 60 * 1000;
  if (!(c.fixAt && c.fixAt >= w.requestedAt) && !timedOut) return;
  let results = [];
  try { const r = await api(`/computers/${encodeURIComponent(w.number)}/diag`); results = (r.fixResults || []).filter((x) => x.at >= w.requestedAt - 1000 && w.ids.includes(x.id)); } catch (e) { return; }
  const done = new Set(results.map((x) => x.id));
  if (!w.ids.every((id) => done.has(id)) && !timedOut) return;
  if (fixWatch !== w) return;
  fixWatch = null;
  if ($('sysModal').classList.contains('hidden')) { toast(`התיקונים במחשב ${w.number} הסתיימו`, 'ok'); return; }
  const rows = w.ids.map((id) => {
    const r = results.find((x) => x.id === id);
    const label = (FIX_INFO[id] || {}).l || id;
    if (!r) return `<div class="evRow"><span>\u23F3</span><span><b>${esc(label)}</b>: לא התקבלה תשובה מהמחשב</span></div>`;
    const extra = id === 'clean_temp' && r.ok ? ` - שוחררו ${r.freedMb} MB` : r.msg && !r.ok ? ' - ' + esc(r.msg) : '';
    return `<div class="evRow"><span>${r.ok ? '\u2705' : '\u274C'}</span><span><b>${esc(label)}</b>: ${r.ok ? 'בוצע' : 'נכשל'}${extra}</span></div>`;
  }).join('');
  $('sysBody').innerHTML = '<div class="netHead"><span>תוצאות התיקון</span></div>' + rows + '<div style="margin-top:14px"><button id="rescan2" class="small primary" type="button">\u{1F504} סרוק שוב לאימות</button></div>';
  $('rescan2').onclick = () => startScan(c);
}

$('q').addEventListener('input', render);
$('logout').onclick = async () => { await api('/logout', { method: 'POST' }).catch(() => {}); showLogin(); };
async function doLogin() {
  $('loginErr').textContent = '';
  try { await api('/login', { method: 'POST', body: { password: $('pw').value } }); $('pw').value = ''; showApp(); }
  catch (e) { $('loginErr').textContent = e.status === 429 ? 'יותר מדי ניסיונות, נסה מאוחר יותר' : e.status === 503 ? 'השרת לא הוגדר (חסר DASHBOARD_PASSWORD)' : 'סיסמה שגויה'; }
}
$('loginBtn').onclick = doLogin;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

api('/computers').then(showApp).catch(() => {});
</script>
</body>
</html>
